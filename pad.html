<script>
/* =====================================================================================
 *  AOG WATCH PARTY · "server" chạy trên Firebase Realtime Database (không cần Cloud Functions)
 *  -----------------------------------------------------------------------------------
 *  Giữ NGUYÊN giao diện gọi hàm như bản Apps Script: api_poll / api_sync / api_admin trả về
 *  cùng một dạng "view" → Tv/Pad/Admin không phải viết lại. Dữ liệu đồng bộ thời gian thực
 *  (WebSocket) thay vì poll HTTP → không còn lỗi 503 / treo / nhiều tài khoản Google.
 *
 *  Quyền ghi được kiểm tra bằng Security Rules (firebase/database.rules.json):
 *   • TV: chỉ đọc, không cần đăng nhập.
 *   • Pad: đăng nhập ẩn danh + khóa k trong link (k so khớp /secret/keys, khóa không ai đọc được).
 *   • Admin: đăng nhập ẩn danh + PIN (so khớp /secret/pin).
 *  Các bước "server" (bắt đầu lượt, chốt kết quả, trao quà, về màn chờ) do pad/admin thực hiện
 *  bằng transaction → an toàn khi nhiều máy cùng làm, chỉ 1 máy thắng.
 * ===================================================================================== */
(function (root) {
  'use strict';
  var BASE_K = {
    LEAD_MS: 6000,        // SẴN SÀNG + 3-2-1
    GRACE_MS: 3500,       // chờ điểm cuối sau khi hết giờ
    HOLD_MS: 5000,        // hiện kết quả bao lâu rồi tự về màn chờ
    READY_TTL: 6000,      // "sẵn sàng" hết hạn nếu pad mất tín hiệu
    MAX_TPS: 25,          // trần tap/giây
    DURATION: 30
  };
  var TEAMS = ['SGP', 'FPT'];

  function createApi(firebase, opts) {
    opts = opts || {};
    var K = Object.assign({}, BASE_K, opts.K || {});
    var page = opts.page || 'tv', myTeam = opts.team || '', myKey = opts.key || '';
    var app = firebase.initializeApp(opts.config, opts.appName || undefined);
    var db = app.database(), auth = app.auth ? app.auth() : null;
    var TS = firebase.database.ServerValue.TIMESTAMP;
    var S = { state: null, settings: null, stats: null, ready: {}, dev: {}, scores: {}, scoresRid: null, meta: null, prizes: null,
      offset: 0, connected: true, discAt: 0, loaded: 0 };
    var role = null, uid = null, padErr = '', authP = null;
    var lastScore = {}, lastDevAt = 0, lastReady = null, lastReadyAt = 0, tries = {};

    function now() { return Date.now() + S.offset; }
    // Gửi thẳng các lượt gần nhất sang Apps Script → ghi Google Sheet ngay (gộp theo Mã lượt nên gửi lặp không trùng).
    // Không chặn game; lỡ 1 lần thì lần sau (gửi kèm 5 lượt gần nhất) hoặc nút "Chép toàn bộ" ở Admin sẽ bù.
    function vals(o) { return Object.keys(o || {}).sort().map(function (k) { return o[k]; }); }
    function sheetUrl(arg) { var u = opts.sheetSyncUrl; return u + (u.indexOf('?') < 0 ? '?' : '&') + 'fn=fbpush&arg=' + encodeURIComponent(JSON.stringify(arg)) + '&_=' + Date.now(); }
    function pingSheet(delay) {
      if (!opts.sheetSyncUrl || typeof fetch !== 'function') return;
      setTimeout(function () {
        Promise.all([ref('log').orderByKey().limitToLast(5).once('value'), ref('prizeLog').orderByKey().limitToLast(5).once('value')]).then(function (s) {
          return fetch(sheetUrl({ t: opts.sheetToken || '', log: vals(s[0].val()), prizes: vals(s[1].val()) }), { mode: 'no-cors', credentials: 'omit', cache: 'no-store' });
        }).catch(function () {});
      }, delay || 0);
    }
    function pushAllToSheet() {
      if (!opts.sheetSyncUrl || typeof fetch !== 'function') return Promise.resolve(fail('Chưa cấu hình AOG_SHEET_SYNC_URL'));
      return Promise.all([ref('log').once('value'), ref('prizeLog').once('value')]).then(function (s) {
        var L = vals(s[0].val()), P = vals(s[1].val()), jobs = [], i, tot = { added: 0, updated: 0, sent: L.length + P.length, errors: 0 };
        for (i = 0; i < Math.max(L.length, P.length, 1); i += 6) jobs.push({ log: L.slice(i, i + 6), prizes: P.slice(i, i + 6) });
        return jobs.reduce(function (p, j) {
          return p.then(function () {
            return fetch(sheetUrl({ t: opts.sheetToken || '', log: j.log, prizes: j.prizes }), { credentials: 'omit', cache: 'no-store' })
              .then(function (r) { return r.json(); })
              .then(function (x) { if (x && x.ok) { tot.added += x.added || 0; tot.updated += x.updated || 0; } else tot.errors++; })
              .catch(function () { tot.errors++; });
          });
        }, Promise.resolve()).then(function () { return tot.errors ? fail('Có ' + tot.errors + ' lần gửi lỗi – bấm lại để thử lần nữa') : ok(tot); });
      });
    }
    function ref(p) { return db.ref(p); }
    function emptyState() { return { phase: 'IDLE', seq: 0, roundNo: 0, roundId: '' }; }
    function emptyStats() { return { rounds: 0, winsSGP: 0, winsFPT: 0, draws: 0, tapsSGP: 0, tapsFPT: 0, since: Date.now() }; }
    function defSettings() { return { auto: true, practice: false, duration: K.DURATION }; }
    function throttle(key, ms) { var t = Date.now(); if (tries[key] && t - tries[key] < ms) return false; tries[key] = t; return true; }

    /* ---------- lắng nghe dữ liệu ---------- */
    var readyP = new Promise(function (resolve) {
      var need = { state: 0, settings: 0, stats: 0 };
      function mark(k) { if (!need[k]) { need[k] = 1; S.loaded++; if (S.loaded >= 3) resolve(); } }
      ref('.info/serverTimeOffset').on('value', function (s) { S.offset = s.val() || 0; });
      ref('.info/connected').on('value', function (s) { var c = !!s.val(); if (!c && S.connected) S.discAt = Date.now(); S.connected = c; });
      ref('state').on('value', function (s) { S.state = s.val() || emptyState(); watchScores(); mark('state'); });
      ref('settings').on('value', function (s) { S.settings = Object.assign(defSettings(), s.val() || {}); mark('settings'); });
      ref('stats').on('value', function (s) { S.stats = Object.assign(emptyStats(), s.val() || {}); mark('stats'); });
      ref('ready').on('value', function (s) { S.ready = s.val() || {}; });
      ref('dev').on('value', function (s) { S.dev = s.val() || {}; });
      ref('meta').on('value', function (s) { S.meta = s.val() || {}; });
      // giữ cache cho transaction quà (transaction chạy trên dữ liệu cục bộ trước – thiếu cache sẽ tưởng là 'không có quà')
      ref('prizes').on('value', function (s) { S.prizes = s.val() || {}; });
      setTimeout(resolve, 8000);    // không chặn mãi nếu mạng chậm
    });
    function watchScores() {
      var rid = (S.state && S.state.roundId) || '';
      if (rid === S.scoresRid) return;
      if (S.scoresRid) ref('scores/' + S.scoresRid).off();
      S.scoresRid = rid; S.scores = {};
      if (rid) ref('scores/' + rid).on('value', function (s) { if (S.scoresRid === rid) S.scores = s.val() || {}; });
    }

    /* ---------- đăng nhập (pad / admin) ---------- */
    function signIn() {
      if (!auth) return Promise.reject(new Error('Không có Firebase Auth'));
      if (!authP) authP = (auth.currentUser ? Promise.resolve({ user: auth.currentUser }) : auth.signInAnonymously())
        .then(function (c) { uid = (c && c.user ? c.user.uid : auth.currentUser.uid); return uid; })
        .catch(function (e) { authP = null; throw e; });
      return authP;
    }
    var padReady = null;
    function ensurePad() {
      if (role === 'pad') return Promise.resolve();
      if (padErr) return Promise.reject(new Error(padErr));
      if (!padReady) padReady = signIn().then(function () {
        return ref('padAuth/' + uid + '/' + myTeam).set({ k: myKey, at: TS });
      }).then(function () {
        role = 'pad';
        ref('dev/' + myTeam).onDisconnect().remove();
      }).catch(function (e) { padReady = null; if (isDenied(e)) padErr = 'key'; throw e; });
      return padReady;
    }
    function isDenied(e) { return /permission|PERMISSION_DENIED/i.test(String(e && (e.code || e.message || e))); }
    function canWrite() { return role === 'pad' || role === 'admin'; }

    /* ---------- view (cùng dạng với Apps Script view_) ---------- */
    function readyMap(st, t) {
      var out = { SGP: false, FPT: false };
      if (st.phase === 'ROUND') return out;
      TEAMS.forEach(function (k) { var d = S.ready[k]; out[k] = !!(d && d.seq === (st.seq || 0) && t - (d.t || 0) < K.READY_TTL); });
      return out;
    }
    function view() {
      var s = S.state || emptyState(), t = now(), stt = S.settings || defSettings();
      var phase = s.phase || 'IDLE';
      if (phase === 'RESULT' && s.result && t >= s.result.at + K.HOLD_MS) { phase = 'IDLE'; if (canWrite()) backToIdle(s.roundId); }
      if (phase === 'ROUND' && t >= s.endAt) maybeFinalize(s, t);
      var st = {
        v: 0, seq: s.seq || 0, phase: phase, roundId: s.roundId || '', roundNo: s.roundNo || 0, practice: !!s.practice,
        startAt: s.startAt || 0, endAt: s.endAt || 0, duration: s.duration || stt.duration || K.DURATION,
        result: phase === 'RESULT' ? s.result : null,
        lv: phase === 'IDLE' && s.result && s.result.counted && !s.result.voided ? (s.roundNo || 0) : 0
      };
      var dev = {};
      TEAMS.forEach(function (k) { var d = S.dev[k]; dev[k] = d ? { age: Math.max(0, t - (d.t || 0)), b: d.b == null ? -1 : d.b, c: d.c ? 1 : 0 } : null; });
      var out = { now: t, st: st, stats: S.stats || emptyStats(), set: stt, rd: readyMap(st, t), dev: dev, sc: { SGP: 0, FPT: 0 }, fin: { SGP: false, FPT: false } };
      if (phase === 'ROUND') {
        TEAMS.forEach(function (k) { var x = S.scores[k] || {}; out.sc[k] = x.n || 0; out.fin[k] = !!x.fin; });
      } else if (phase === 'RESULT' && s.result) {
        out.sc = { SGP: s.result.SGP, FPT: s.result.FPT }; out.fin = { SGP: true, FPT: true };
      }
      return out;
    }

    /* ---------- các bước "server" bằng transaction ---------- */
    function startRound(practice, duration, readySeq, manual) {
      var d = Math.max(5, Math.min(120, Math.round(duration || K.DURATION)));
      var res = { ok: false, error: '' };
      return ref('state').transaction(function (cur) {
        cur = cur || emptyState();
        res.error = '';
        if (cur.phase === 'ROUND') { res.error = 'Đang có lượt chơi'; return; }
        var heldResult = cur.phase === 'RESULT' && cur.result && now() < cur.result.at + K.HOLD_MS;
        if (manual && heldResult) { res.error = 'Bấm "Lượt tiếp theo" trước'; return; }
        if (readySeq !== undefined && (cur.seq || 0) !== readySeq) { res.error = 'stale'; return; }
        var t = now(), seq = (cur.seq || 0) + 1;
        return { seq: seq, phase: 'ROUND', roundNo: seq, roundId: 'R' + seq + '-' + t.toString(36), practice: !!practice,
          startAt: t + K.LEAD_MS, duration: d, endAt: t + K.LEAD_MS + d * 1000, result: null };
      }).then(function (r) { res.ok = !!(r && r.committed); if (!res.ok && !res.error) res.error = 'Không bắt đầu được'; return res; });
    }

    function maybeFinalize(s, t) {
      if (!canWrite()) return;
      var a = (S.scores.SGP || {}), b = (S.scores.FPT || {});
      var bothFin = !!(a.fin && b.fin) && S.scoresRid === s.roundId;
      if (!bothFin && t < s.endAt + K.GRACE_MS) return;
      if (!throttle('fin', 900)) return;
      finalize(s.roundId);
    }
    function finalize(rid) {
      // đọc điểm mới nhất từ server rồi chốt bằng transaction (chỉ 1 máy thành công)
      return ref('scores/' + rid).once('value').then(function (snap) {
        var sc = snap.val() || {}, A = (sc.SGP && sc.SGP.n) || 0, B = (sc.FPT && sc.FPT.n) || 0;
        var winner = A > B ? 'SGP' : B > A ? 'FPT' : 'DRAW', result = null;
        return ref('state').transaction(function (cur) {
          if (!cur || cur.phase !== 'ROUND' || cur.roundId !== rid) return;
          var counted = !cur.practice;
          result = { SGP: A, FPT: B, winner: winner, margin: Math.abs(A - B), counted: counted, voided: false, at: now(),
            prize: null, prizeNote: counted && winner !== 'DRAW' ? 'pending' : '' };
          cur.phase = 'RESULT'; cur.result = result;
          return cur;
        }).then(function (r) {
          if (!r || !r.committed) return;
          var st = r.snapshot.val();
          return afterFinalize(st);
        });
      }).catch(function () {});
    }
    function afterFinalize(st) {
      var r = st.result, jobs = [];
      if (r.counted) jobs.push(ref('stats').transaction(function (x) {
        x = Object.assign(emptyStats(), x || {});
        x.rounds++; x.tapsSGP += r.SGP; x.tapsFPT += r.FPT;
        if (r.winner === 'SGP') x.winsSGP++; else if (r.winner === 'FPT') x.winsFPT++; else x.draws++;
        return x;
      }));
      var logRef = ref('log').push();
      jobs.push(logRef.set(logRow(st, 'Hoàn thành', r.SGP, r.FPT, r.winner, '')));
      jobs.push(ref('state/result/logKey').set(logRef.key));
      return Promise.all(jobs).then(function () { if (r.prizeNote === 'pending') return awardPrize(st, logRef.key); }).then(function () { pingSheet(300); pingSheet(8000); });
    }
    function logRow(st, status, a, b, winner, note) {
      return { no: st.roundNo || 0, at: st.startAt || now(), sgp: a, fpt: b,
        result: winner === 'SGP' ? 'SGP thắng' : winner === 'FPT' ? 'FPT thắng' : winner === 'DRAW' ? 'Hòa' : '—',
        margin: Math.abs(a - b), duration: st.duration || 0, type: st.practice ? 'Chơi thử' : 'Chính thức', status: status, rid: st.roundId || '', note: note || '' };
    }
    function awardPrize(st, logKey) {
      var picked = null, total = 0, any = false;
      return ref('prizes').transaction(function (list) {
        picked = null; any = false;
        if (!list) return;                             // không có quà
        var avail = [];
        Object.keys(list).forEach(function (id) { any = true; var p = list[id]; if (p && p.qty > 0 && p.weight > 0) avail.push(id); });
        if (!avail.length) return;                     // hết quà → hủy transaction
        total = 0; avail.forEach(function (id) { total += list[id].weight; });
        var x = Math.random() * total, id = avail[avail.length - 1];
        for (var i = 0; i < avail.length; i++) { x -= list[avail[i]].weight; if (x < 0) { id = avail[i]; break; } }
        list[id].qty -= 1; list[id].given = (list[id].given || 0) + 1;
        picked = { id: id, name: list[id].name, left: list[id].qty };
        return list;
      }).then(function (r) {
        var upd = {};
        if (r && r.committed && picked) {
          var pl = ref('prizeLog').push();
          upd['prizeLog/' + pl.key] = { at: now(), no: st.roundNo, team: st.result.winner, id: picked.id, name: picked.name, left: picked.left, rid: st.roundId, st: 'Đã trao' };
          upd['state/result/prize'] = { id: picked.id, name: picked.name };
          upd['state/result/prizeNote'] = 'ok';
          upd['state/result/prizeLogKey'] = pl.key;
          if (logKey) upd['log/' + logKey + '/note'] = 'Quà: ' + picked.name;
        } else {
          upd['state/result/prizeNote'] = any ? 'out' : 'none';
        }
        return ref().update(upd);
      });
    }
    function backToIdle(rid) {
      if (!throttle('idle', 1500)) return;
      ref('state').transaction(function (cur) {
        if (!cur || cur.phase !== 'RESULT' || cur.roundId !== rid || !cur.result || now() < cur.result.at + K.HOLD_MS) return;
        cur.phase = 'IDLE'; return cur;
      }).catch(function () {});
    }

    /* ---------- API: poll (TV / admin) ---------- */
    function api_poll() { return Promise.resolve(view()); }

    /* ---------- API: sync (pad) ---------- */
    function api_sync(p) {
      p = p || {};
      return ensurePad().then(function () {
        var t = now(), s = S.state || emptyState(), team = myTeam, writes = [];
        if (t - lastDevAt > 2500) { lastDevAt = t; writes.push(ref('dev/' + team).set({ t: TS, b: p.b == null ? -1 : p.b, c: p.c ? 1 : 0 })); }
        var v0 = view(), effPhase = v0.st.phase;
        // nút SẴN SÀNG
        if (effPhase !== 'ROUND') {
          var want = p.rdy && Number(p.rseq) === (s.seq || 0);
          if (want) {
            if (lastReady !== s.seq || Date.now() - lastReadyAt > 2000) { lastReady = s.seq; lastReadyAt = Date.now(); writes.push(ref('ready/' + team).set({ seq: s.seq || 0, t: TS })); }
            var other = team === 'SGP' ? 'FPT' : 'SGP', od = S.ready[other];
            if ((S.settings || {}).auto !== false && od && od.seq === (s.seq || 0) && t - (od.t || 0) < K.READY_TTL && throttle('auto', 800)) {
              var stt = S.settings || defSettings();
              writes.push(startRound(stt.practice, stt.duration, s.seq || 0, false));
            }
          } else if (lastReady !== null) { lastReady = null; writes.push(ref('ready/' + team).remove()); }
        }
        // điểm
        var me = { n: 0, fin: false, rid: s.roundId || '' };
        if (s.phase === 'ROUND' && p.roundId === s.roundId && t < s.endAt + K.GRACE_MS) {
          var prev = S.scores[team] || {}, pn = prev.n || 0;
          var elapsed = Math.max(0, (Math.min(t, s.endAt) - s.startAt) / 1000) + 2;
          var cap = Math.ceil(K.MAX_TPS * elapsed);
          var early = t < s.startAt - 500;
          var n = early ? pn : Math.min(Math.max(pn, Math.floor(Number(p.count) || 0)), cap);
          var fin = !!prev.fin || (!!p.fin && t >= s.endAt - 300);
          me = { n: n, fin: fin, rid: s.roundId };
          var key = s.roundId, last = lastScore[key];
          if (!early && (!last || last.n !== n || last.fin !== fin)) { lastScore = {}; lastScore[key] = { n: n, fin: fin }; writes.push(ref('scores/' + key + '/' + team).set({ n: n, fin: fin, t: TS })); }
        } else if (s.phase === 'RESULT' && s.result && p.roundId === s.roundId) {
          me = { n: s.result[team], fin: true, rid: s.roundId };
        }
        Promise.all(writes).catch(function () {});     // ghi nền; không chặn giao diện
        var v = view(); v.me = me; return v;
      }, function (e) {
        if (padErr) return { error: padErr };
        throw e;
      });
    }

    /* ---------- API: admin ---------- */
    var adminReady = null;
    function ensureAdmin(pin) {
      if (role === 'admin') return Promise.resolve(true);
      if (!adminReady) adminReady = signIn().then(function () {
        return ref('adminAuth/' + uid).set({ pin: String(pin || ''), at: TS });
      }).then(function () { role = 'admin'; return true; }, function (e) { adminReady = null; if (isDenied(e)) return false; throw e; });
      return adminReady;
    }
    function ok(extra) { var r = Object.assign({ ok: true }, extra || {}); r.view = view(); return r; }
    function fail(msg) { var r = { ok: false, error: msg }; r.view = view(); return r; }

    function api_admin(a) {
      a = a || {};
      var act = a.action;
      if (act === 'setup') return setup(a);
      return readyP.then(function () {
        if (!(S.meta && S.meta.inited)) return { ok: false, error: 'Hệ thống chưa khởi tạo', needSetup: true };
        return ensureAdmin(a.pin).then(function (okPin) {
          if (!okPin) return { ok: false, error: 'Sai PIN' };
          return adminAct(act, a);
        });
      }).catch(function (e) { return { ok: false, error: String(e && e.message || e) }; });
    }
    function setup(a) {
      var pin = String(a.pin || '').trim();
      if (pin.length < 4) return Promise.resolve({ ok: false, error: 'PIN tối thiểu 4 ký tự' });
      function rnd() { var s = ''; var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for (var i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
      var keys = { SGP: 'sgp-' + rnd(), FPT: 'fpt-' + rnd() };
      return signIn().then(function () {
        return ref('secret').set({ pin: pin, keys: keys });
      }).then(function () { return ref('meta').set({ inited: true, at: TS }); })
        .then(function () { return ref('adminAuth/' + uid).set({ pin: pin, at: TS }); })
        .then(function () { role = 'admin'; return { ok: true, keys: keys }; })
        .catch(function (e) { return { ok: false, error: isDenied(e) ? 'Hệ thống đã được khởi tạo trước đó' : String(e.message || e) }; });
    }
    function adminAct(act, a) {
      var stt = S.settings || defSettings(), s = S.state || emptyState();
      switch (act) {
        case 'auth': return ok();
        case 'start': return startRound(a.practice !== undefined ? !!a.practice : stt.practice, a.duration !== undefined ? Number(a.duration) : stt.duration, undefined, true)
          .then(function (r) { return r.ok ? ok() : fail(r.error); });
        case 'settings': {
          var x = {};
          if (a.auto !== undefined) x.auto = !!a.auto;
          if (a.practice !== undefined) x.practice = !!a.practice;

          if (!name) return Promise.resolve({ ok: false, error: 'Tên quà không được để trống' });

<script>
/* ===== AOG · thư viện dùng chung: gọi server, đồng bộ giờ, vòng poll, giữ màn hình sáng ===== */
window.AOG = (function () {
  var BOOT = window.BOOT || {};
  var CFG = BOOT.cfg || { duration: 30, leadMs: 5000, teams: { SGP: { code: 'SGP', name: 'SAIGON PHANTOM' }, FPT: { code: 'FPT', name: 'FPT X FLASH' } } };

  /* --- gọi hàm server có timeout ---
   *  • Trang chạy trên GitHub Pages (có window.AOG_API_URL): fetch POST tới Web App, không kèm cookie Google.
   *  • Trang chạy trong Apps Script (HtmlService): google.script.run như cũ. */
  var API = window.AOG_API_URL || '';
  function rpc(fn, arg, timeoutMs) {
    timeoutMs = timeoutMs || 9000;
    if (window.AOG_FB_API) {   // bản Firebase: dữ liệu thời gian thực, gọi hàm cục bộ (firebase/fb-core.js)
      return new Promise(function (resolve, reject) {
        var to = setTimeout(function () { reject(new Error('timeout')); }, timeoutMs);
        window.AOG_FB_API.call(fn, arg).then(function (v) { clearTimeout(to); resolve(v); }, function (e) { clearTimeout(to); reject(e); });
      });
    }
    if (API) {
      var ctl = window.AbortController ? new AbortController() : null;
      var to = setTimeout(function () { if (ctl) ctl.abort(); }, timeoutMs);
      // GET (request "đơn giản": không preflight, không cookie). Với Web App ẩn danh, GET ổn định hơn POST.
      var url = API + (API.indexOf('?') < 0 ? '?' : '&') + 'fn=' + encodeURIComponent(fn) +
        (arg === undefined || arg === null ? '' : '&arg=' + encodeURIComponent(JSON.stringify(arg))) + '&_=' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      return fetch(url, { method: 'GET', credentials: 'omit', cache: 'no-store', redirect: 'follow', signal: ctl ? ctl.signal : undefined }).then(function (r) {
        clearTimeout(to);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }, function (e) { clearTimeout(to); throw e; }).then(function (j) {
        if (j && j.__rpcError) throw new Error(j.__rpcError);
        return j;
      });
    }
    return new Promise(function (resolve, reject) {
      var done = false;
      var to = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, timeoutMs);
      try {
        google.script.run
          .withSuccessHandler(function (r) { if (done) return; done = true; clearTimeout(to); resolve(r); })
          .withFailureHandler(function (e) { if (done) return; done = true; clearTimeout(to); reject(e); })[fn](arg);
      } catch (e) { done = true; clearTimeout(to); reject(e); }
    });
  }

  /* --- đồng hồ: ước lượng lệch giờ so với server (lấy mẫu có RTT nhỏ nhất) --- */
  var clock = {
    off: 0, rtt: 0, samples: [],
    update: function (t0, t1, srv) {
      var rtt = t1 - t0, off = srv - (t0 + t1) / 2;
      this.samples.push({ rtt: rtt, off: off, at: t1 });
      var cut = t1 - 40000;
      this.samples = this.samples.filter(function (s) { return s.at >= cut; }).slice(-12);
      var best = this.samples[0];
      for (var i = 1; i < this.samples.length; i++) if (this.samples[i].rtt < best.rtt) best = this.samples[i];
      this.off = best.off; this.rtt = best.rtt;

    now: function () { return Date.now() + this.off; }
  };

  /* --- trạng thái mạng --- */
  var online = true, listeners = [];
  function setOnline(v) {
    if (v === online) return;
    online = v; document.body.classList.toggle('offline', !v);
    listeners.forEach(function (f) { try { f(v); } catch (e) {} });
  }

  /* --- vòng poll: không chồng request, tự lùi khi lỗi, có kick() để chạy ngay --- */
  function loop(fn, o) {
    var timer = null, busy = false, stopped = false, kickReq = false, fails = 0, lastOk = Date.now();
    function run() {
      if (stopped || busy) return;
      busy = true; clearTimeout(timer);
      var t0 = Date.now(), ok = false;
      Promise.resolve().then(fn).then(function (v) {
        var t1 = Date.now();
        if (!v || typeof v.now !== 'number') throw new Error('bad');
        clock.update(t0, t1, v.now); lastOk = t1; fails = 0; ok = true; setOnline(true);
        o.onView(v);
      }).catch(function (e) {
        fails++; if (Date.now() - lastOk > 3500) setOnline(false);
        if (o.onError) o.onError(e);
      }).then(function () {
        busy = false;
        var base = ok ? o.interval() : Math.min(2500, 250 * Math.pow(1.6, Math.min(fails, 6)));
        var wait = kickReq ? 0 : Math.max(0, base - (Date.now() - t0));

        timer = setTimeout(run, wait);
      });
    }

      start: run,
      kick: function () { if (busy) kickReq = true; else { clearTimeout(timer); run(); } },
      stop: function () { stopped = true; clearTimeout(timer); }
    };
  }

  /* --- pha hiển thị suy ra từ trạng thái server + đồng hồ đã bù lệch --- */
  function derive(v) {
    if (!v) return { p: 'IDLE' };
    var st = v.st;
    if (st.phase === 'IDLE') return { p: 'IDLE' };
    if (st.phase === 'RESULT') return { p: 'RESULT' };

  }

  /* --- giữ màn hình sáng: Wake Lock + video ẩn (dự phòng). Cài đặt hệ điều hành vẫn là lớp chính. --- */

        v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:.02;pointer-events:none';
        v.srcObject = c.captureStream(4);
        document.body.appendChild(v); vid = v;
        setInterval(function () { k ^= 1; x.fillStyle = k ? '#000' : '#020202'; x.fillRect(0, 0, 4, 4); }, 500);
      } catch (e) { vid = {}; }
    }
    if (vid && vid.play) { try { var p = vid.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) keepAwake(); });

  function fullscreen() {
    try { var d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d); } catch (e) {}
  }

  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('aog.' + k)); localStorage.setItem('aog.' + k, JSON.stringify(v)); } catch (e) { return null; } }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }

  return {
    BOOT: BOOT, CFG: CFG, rpc: rpc, clock: clock, loop: loop, derive: derive, keepAwake: keepAwake, fullscreen: fullscreen,
    store: store, $: $, $$: $$, p2: p2, setOnline: setOnline, isOnline: function () { return online; },
    onOnline: function (f) { listeners.push(f); }
  };
})();

body[data-p="RESULT"][data-r="LOSE"] .zone{filter:saturate(.25) brightness(.6)}
body[data-p="RESULT"][data-r="WIN"] .zone{animation:win 1s ease-in-out infinite alternate}
@keyframes win{to{filter:brightness(1.18) saturate(1.2)}}
.v-cnt,.v-big,.v-idle,.v-end{display:none}
body[data-p="IDLE"] .v-idle,body[data-p="COUNT"] .v-big,body[data-p="RUN"] .v-cnt,body[data-p="END"] .v-end,body[data-p="RESULT"] .v-end{display:block}

/* nút SẴN SÀNG (tự bắt đầu lượt kế tiếp khi cả 2 pad cùng bấm) */
.rbtn{display:none;margin:2.2vh auto 0;width:min(80vw,440px);min-height:clamp(84px,17vh,150px);border:0;cursor:pointer;padding:10px 18px;color:#fff;background:#0b0a2c;
  clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);position:relative;z-index:3;transition:background .15s,transform .08s}
.rbtn:active{transform:scale(.97)}
.rbtn .rb1{display:block;font:400 clamp(26px,9vw,52px)/1 var(--f-display);text-transform:uppercase;padding-right:.1em}
.rbtn .rb2{display:block;margin-top:7px;font:700 clamp(10px,3vw,14px)/1.25 var(--f-label);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.rbtn.on{background:var(--ok);color:#04230f;animation:rdy 1s ease-in-out infinite alternate}
@keyframes rdy{to{filter:brightness(1.12)}}
.rbtn[disabled]{opacity:.5;cursor:default}
body[data-p="IDLE"] .rbtn,body[data-p="RESULT"] .rbtn{display:block}
body.noauto .rbtn{display:none}
body[data-p="RESULT"] .cnt.num{font-size:min(30vw,16vh)}
body[data-p="RESULT"] .lbl{font-size:clamp(26px,9vw,60px)}

/* footer */
.ft{flex:none;display:flex;align-items:center;gap:10px;height:30px;font:700 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ft .dot{width:10px;height:10px;background:var(--ok);transform:skewX(-14deg);flex:none}
body.offline .ft .dot{background:var(--warn)} body.offline .ft{color:var(--warn)}
.ft .sp{flex:1}
.ft .tally b{color:#fff;font:900 14px/1 var(--f-ui);letter-spacing:0}
.ft .tally .a{color:var(--sgp)} .ft .tally .b{color:var(--fpt-hi)}
</style>
</head>
<body data-p="IDLE" class="">
<div id="pad" class="">
  <div class="hd">
    <div class="logo" role="img" aria-label="Logo đội"></div>
    <div class="who"><div class="code" id="code">SGP</div><div class="name" id="name">SAIGON PHANTOM</div></div>
    <div class="tm"><span class="num" id="tm">30</span><small>GIÂY</small></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

  <div class="zone" id="zone" role="button" aria-label="Vùng chạm tính điểm">
    <div class="in">
      <div class="v-idle"><div class="lbl">Sẵn sàng chưa?</div><div class="sub" id="idleSub" style="margin-top:2vh">Cả hai bấm SẴN SÀNG để bắt đầu</div></div>
      <div class="v-big"><div class="big" id="big">3</div><div class="sub" id="bigsub"></div></div>
      <div class="v-cnt"><div class="lbl" id="l1">Chạm!</div><span class="cnt num" id="cnt">0</span><div class="sub" id="l2">Điểm của bạn</div></div>
      <div class="v-end"><div class="lbl" id="l3">Hết giờ</div><span class="cnt num" id="cnt2">0</span><div class="sub" id="l4"></div></div>
      <button class="rbtn" id="rbtn" type="button"><span class="rb1" id="rb1">SẴN SÀNG</span><span class="rb2" id="rb2"></span></button>
    </div>
  </div>

  <div class="ft"><span class="dot"></span><span id="st">Đã kết nối</span><span class="sp"></span>
    <span class="tally">TỔNG THẮNG <b class="a" id="ta">0</b> – <b class="b" id="tb">0</b></span></div>
</div>
<div class="conn">Mất kết nối · điểm vẫn được giữ trên máy</div>

<script>
(function () {
  var A = AOG, $ = A.$, team = A.BOOT.team, key = A.BOOT.key || '', T = A.CFG.teams;
  if (!T[team]) return;   // link thiếu/sai team → trang báo lỗi (xem BOOT của bản web)
  var view = null, round = { id: '', count: 0, fin: false }, ready = false, rseq = 0;
  var dirty = true, lastKick = null, lastSave = 0, fsTried = false, last = {};
  var batt = { b: -1, c: 0 };
  var other = team === 'SGP' ? 'FPT' : 'SGP';
  function badLink(m) { lp && lp.stop && lp.stop(); document.body.innerHTML = '<div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#0c0b2e;color:#fff;font:700 20px/1.5 sans-serif">' + m + '</div>'; }

  document.body.className = 't-' + team; $('#pad').className = 't-' + team;
  $('#code').textContent = team; $('#name').textContent = T[team].name;

  try { navigator.getBattery().then(function (b) { function u() { batt.b = Math.round(b.level * 100); batt.c = b.charging ? 1 : 0; } u(); b.addEventListener('levelchange', u); b.addEventListener('chargingchange', u); }).catch(function () {}); } catch (e) {}

  /* ---------- đồng bộ ---------- */
  function ensureRound(v) {
    var id = v.st.roundId;
    if (v.st.phase === 'IDLE') { if (round.id) round = { id: '', count: 0, fin: false }; return; }
    if (id !== round.id) {
      round = { id: id, count: 0, fin: false };
      var s = A.store('pad.' + team);               // khôi phục nếu tải lại trang giữa lượt
      if (s && s.id === id) round.count = s.count || 0;
    }
  }
  var lp = A.loop(function () {
    var st = view && view.st;
    if (st && st.phase === 'ROUND' && round.id === st.roundId && A.clock.now() >= st.endAt) round.fin = true;
    return A.rpc('api_sync', { team: team, key: key, roundId: round.id, count: round.count, fin: round.fin, rdy: ready ? 1 : 0, rseq: rseq, b: batt.b, c: batt.c }, 7000)
      .then(function (v) {
        if (v && v.error === 'key') { badLink('Sai hoặc thiếu khóa “k” trong link pad – mở lại đúng link BTC cung cấp.'); }
        if (!v || v.error) throw new Error(v && v.error || 'bad'); return v;
      });
  }, {
    interval: function () { return view && view.st.phase === 'ROUND' ? 400 : 1100; },
    onView: function (v) {
      view = v; ensureRound(v);
      if (v.st.phase === 'ROUND' || (ready && v.st.seq !== rseq)) ready = false;   // lượt mới bắt đầu → xóa trạng thái sẵn sàng
      if (v.me && v.me.rid === v.st.roundId && round.id === v.st.roundId && v.me.n > round.count) { round.count = v.me.n; dirty = true; }
      var t = Date.now(); if (round.id && t - lastSave > 700) { lastSave = t; A.store('pad.' + team, { id: round.id, count: round.count }); }
      // đẩy điểm cuối ngay đúng lúc hết giờ
      if (v.st.phase === 'ROUND') {
        var sig = v.st.roundId; if (lastKick !== sig) { lastKick = sig; var ms = v.st.endAt - A.clock.now(); setTimeout(function () { lp.kick(); }, Math.max(0, ms + 40)); }
      }
    }
  });
  lp.start();

  /* ---------- chạm ---------- */
  function canTap() {
    if (!view || view.st.phase !== 'ROUND' || round.id !== view.st.roundId) return false;
    var t = A.clock.now(); return t >= view.st.startAt && t < view.st.endAt;
  }
  var zone = $('#zone'), nrip = 0;
  function ripple(x, y) {
    if (nrip > 7) return; nrip++;
    var r = document.createElement('i'); r.className = 'rip';
    var b = zone.getBoundingClientRect(); r.style.left = (x - b.left) + 'px'; r.style.top = (y - b.top) + 'px';
    zone.appendChild(r); setTimeout(function () { r.remove(); nrip--; }, 430);
  }
  document.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (!fsTried) { fsTried = true; A.fullscreen(); A.keepAwake(); }
    if (canTap()) {
      round.count++; dirty = true;
      ripple(e.clientX, e.clientY);
      zone.style.transform = 'scale(.988)'; requestAnimationFrame(function () { zone.style.transform = ''; });
      if (navigator.vibrate) navigator.vibrate(4);
    } else if (view && view.st.phase !== 'RESULT') {
      zone.classList.remove('shake'); void zone.offsetWidth; zone.classList.add('shake');
    }
  }, { passive: false });
  /* nút SẴN SÀNG: bấm để sẵn sàng, bấm lại để hủy */
  var rb = $('#rbtn'), lastRb = 0;
  function readyAllowed() {
    if (!view || !(view.set && view.set.auto)) return false;
    if (view.st.phase === 'IDLE') return true;
    return view.st.phase === 'RESULT' && !!view.st.result && A.clock.now() >= view.st.result.at + (A.CFG.holdMs || 4000);
  }
  rb.addEventListener('pointerdown', function (e) {
    e.preventDefault(); e.stopPropagation();
    if (!fsTried) { fsTried = true; A.fullscreen(); A.keepAwake(); }
    var n = Date.now(); if (n - lastRb < 350 || !readyAllowed()) return; lastRb = n;
    ready = !ready; rseq = view.st.seq;
    if (navigator.vibrate) navigator.vibrate(ready ? [12, 40, 12] : 6);
    lp.kick();
  }, { passive: false });
  ['contextmenu', 'dblclick', 'selectstart', 'gesturestart', 'gesturechange', 'dragstart'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', function (e) { if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) e.preventDefault(); });

  /* ---------- hiển thị ---------- */
  function setText(el, t) { if (el.textContent !== t) el.textContent = t; }
  function set(el, t) { setText(el, t); }
  function frame() {
    requestAnimationFrame(frame);
    if (!view) return;
    var d = A.derive(view), st = view.st, r = null, rs = '';
    // hết thời gian giữ kết quả → pad tự reset về 0 để sẵn sàng lượt mới
    var fresh = d.p === 'RESULT' && !!st.result && A.clock.now() >= st.result.at + (A.CFG.holdMs || 4000);
    if (fresh !== last.fresh) { last.fresh = fresh; dirty = true; }
    if (d.p !== last.p) { last.p = d.p; document.body.setAttribute('data-p', d.p); dirty = true; }
    if (d.p === 'RESULT' && st.result && !fresh) { var w = st.result.winner; r = w === 'DRAW' ? 'DRAW' : (w === team ? 'WIN' : 'LOSE'); }
    if (r !== last.r) { last.r = r; if (r) document.body.setAttribute('data-r', r); else document.body.removeAttribute('data-r'); dirty = true; }

    var cfg = view.set || { auto: true, duration: A.CFG.duration || 30 };
    var secs = d.p === 'RUN' ? Math.ceil(d.ms / 1000) : (d.p === 'IDLE' || d.p === 'COUNT' ? (st.phase === 'ROUND' ? st.duration : cfg.duration) : 0);
    set($('#tm'), String(secs));
    document.body.classList.toggle('last', d.p === 'RUN' && d.ms <= 5000);
    $('#bar').style.transform = 'scaleX(' + (d.p === 'RUN' ? Math.max(0, d.ms / (st.duration * 1000)) : 0) + ')';

    if (d.p === 'COUNT') {
      var c = d.ms > 3000 ? 'SẴN SÀNG' : String(Math.ceil(d.ms / 1000));
      if (c !== last.c) { last.c = c; var b = $('#big'); b.textContent = c; b.style.fontSize = c === 'SẴN SÀNG' ? 'min(15vw,9vh)' : ''; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; set($('#bigsub'), c === 'SẴN SÀNG' ? 'Chuẩn bị chạm!' : 'Chạm ngay khi hết đếm!'); }
    } else last.c = '';

    if (dirty) {
      dirty = false;
      var n = String(round.id && st.phase !== 'IDLE' && !fresh ? round.count : 0), cls = 'cnt num' + (n.length === 3 ? ' d3' : n.length >= 4 ? ' d4' : '');
      set($('#cnt'), n); $('#cnt').className = cls; set($('#cnt2'), n); $('#cnt2').className = cls;
      var l3 = 'Hết giờ', l4 = 'Đang chốt điểm…';
      if (fresh) { l3 = 'Lượt mới'; l4 = 'Điểm về 0 · bấm SẴN SÀNG'; }
      else if (d.p === 'RESULT' && st.result) {
        var o = st.result[other], m = st.result[team];
        l3 = r === 'WIN' ? 'Thắng!' : r === 'LOSE' ? 'Thua rồi' : 'Hòa!';
        l4 = team + ' ' + m + ' – ' + o + ' ' + other;
      }
      set($('#l3'), l3); set($('#l4'), l4);
    }
    document.body.classList.toggle('noauto', !cfg.auto);
    setText($('#idleSub'), cfg.auto ? 'Cả hai bấm SẴN SÀNG để bắt đầu' : 'Chờ BTC bắt đầu');
    if (cfg.auto && (d.p === 'IDLE' || d.p === 'RESULT')) {
      var allowed = readyAllowed(), b1, b2, on = ready && allowed;
      if (!allowed) { var left = d.p === 'RESULT' && st.result ? Math.ceil((st.result.at + (A.CFG.holdMs || 4000) - A.clock.now()) / 1000) : 0; b1 = 'Chờ chút…'; b2 = 'Sẵn sàng được sau ' + Math.max(1, left) + ' s'; }
      else if (ready) { b1 = 'Đã sẵn sàng'; b2 = view.rd && view.rd[other] ? 'Đối thủ cũng sẵn sàng!' : 'Chờ đối thủ · chạm để hủy'; }
      else { b1 = 'Sẵn sàng'; b2 = view.rd && view.rd[other] ? 'Đối thủ đã sẵn sàng!' : (d.p === 'RESULT' ? 'Bấm để chơi tiếp' : 'Bấm khi bạn đã sẵn sàng'); }
      setText($('#rb1'), b1); setText($('#rb2'), b2);
      rb.classList.toggle('on', on); rb.disabled = !allowed;
    }
    setText($('#st'), A.isOnline() ? 'Đã kết nối' : 'Mất kết nối – đang thử lại');
    var s = view.stats; set($('#ta'), String(s.winsSGP)); set($('#tb'), String(s.winsFPT));
  }
  requestAnimationFrame(frame);
  A.keepAwake();
})();
</script>
</body>
